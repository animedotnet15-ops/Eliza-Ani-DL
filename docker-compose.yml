version: "3.9"

services:
  eliza:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    volumes:
      - ./sessions:/app/sessions

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
