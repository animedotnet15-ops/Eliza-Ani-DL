services:
  - type: web
    name: eliza-bot
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URI
        sync: false
      - key: DATABASE_NAME
        value: eliza
      - key: PORT
        value: 8080
